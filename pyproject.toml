[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-calendar-mcp"
version = "0.1.0"
description = "Private loopback MCP gateway for the native Calendar broker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
calendar-mcp = "calendar_mcp.__main__:main"

[tool.setuptools]
packages = ["calendar_mcp"]
